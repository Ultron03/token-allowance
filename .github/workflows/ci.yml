name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # The release profile also builds the javadoc, so broken Javadoc fails here and not on release day.
      - name: Build and test
        run: ./mvnw -B -ntp verify -Prelease -Dgpg.skip

  # Providers change how they report usage between Spring AI versions. The weekly run shows a new
  # release breaking us before users upgrade to it.
  spring-ai:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [oldest, newest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Pick the Spring AI version
        id: pick
        env:
          WHICH: ${{ matrix.version }}
        run: |
          if [ "$WHICH" = oldest ]; then
            version=2.0.0
          else
            version=$(curl -fsS https://repo1.maven.org/maven2/org/springframework/ai/spring-ai-bom/maven-metadata.xml \
              | sed -n 's:.*<latest>\(.*\)</latest>.*:\1:p')
          fi
          echo "Spring AI $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test against Spring AI ${{ steps.pick.outputs.version }}
        env:
          SPRING_AI_VERSION: ${{ steps.pick.outputs.version }}
        run: ./mvnw -B -ntp verify "-Dspring-ai.version=$SPRING_AI_VERSION"
